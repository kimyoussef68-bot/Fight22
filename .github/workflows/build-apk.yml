name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Unzip Game
        run: unzip -o iron-fang-android-github.zip -x ".github/*"
      - name: Build Android APK
        run: |
          npm install
          npx cap add android
          python3 -c 'p="android/app/src/main/AndroidManifest.xml"; s=open(p).read(); open(p,"w").write(s.replace("<activity","<activity android:screenOrientation=\"sensorLandscape\"",1)) if "screenOrientation" not in s else None'
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: IronFang-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
